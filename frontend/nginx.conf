# Fase 9E - configuracion nginx para SPA con rutas de pagina.
#
# La pagina publica del enlace vive en `/public/compositions/<token>`. Sin
# este fallback, nginx responderia 404 porque no existe ningun fichero con
# ese nombre: el "enrutado" ocurre dentro del navegador, no en el servidor.
# Cualquier ruta que no sea un fichero real vuelve al index, que es quien
# decide que renderizar (`src/lib/publicLink.ts`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-site/proxy: el navegador usa /api y nginx reenvia al ASGI.
    # proxy_pass sin URI conserva el prefijo /api para FastAPI.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
