# Fase 9E - configuracion nginx para SPA con rutas de pagina.
#
# La pagina publica del enlace vive en `/public/compositions/<token>`. Sin
# este fallback, nginx responderia 404 porque no existe ningun fichero con
# ese nombre: el "enrutado" ocurre dentro del navegador, no en el servidor.
# Cualquier ruta que no sea un fichero real vuelve al index, que es quien
# decide que renderizar (`src/lib/publicLink.ts`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}