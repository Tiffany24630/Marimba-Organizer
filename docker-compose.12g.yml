# FASE 12G: proxy same-site local. Solo junto al compose base y con el
# proyecto marimba12g; usa su propio volumen PostgreSQL y puertos exclusivos.
services:
  db:
    ports: !override ["25447:5432"]
    volumes: !override []
    tmpfs:
      - /var/lib/postgresql/data
  backend:
    ports: !override ["28100:8000"]
    environment:
      APP_ENV: development
      SCHEMA_MANAGED_EXTERNALLY: "false"
      CORS_ORIGINS: http://localhost:28180
      PUBLIC_BASE_URL: http://localhost:28180
      MAIL_PROVIDER: console
      MIGRATION_USER_PASSWORD: ""
      RATE_LIMIT_STORE: memory
  frontend:
    ports: !override ["28180:80"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_DEPLOY_ENV: development
