services:
  - type: web
    name: marimba-organizer-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SCHEMA_MANAGED_EXTERNALLY
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: RATE_LIMIT_STORE
        value: redis
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MAIL_FROM
        sync: false

  - type: keyvalue
    name: marimba-organizer-rate-limit
    plan: free
